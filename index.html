<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  <link href="./src/output.css" rel="stylesheet">
  <title>Frontend Mentor | Blog preview card</title>

</head>
<body class="font-Figtree text-xs grid place-content-center 
h-screen bg-Yellow text-Gray-950">

  <main>
    <div class="w-[327px] bg-White p-6 border border-Gray-950
    rounded-[20px] shadow-Box sm:w-[384px]">

      <img 
      src="./assets/images/illustration-article.svg" 
      alt="Article Illustration"
      class="rounded-xl mb-6 aspect-[1.4/1] object-cover w-full aspect-[5/3]">
      
      <div class="bg-Yellow font-bold py-1
      px-3 inline-block rounded-sm mb-[14px]
      sm:text-sm">
        <p>Learning</p>
      </div>
      
      <p class="mb-4
      sm:text-sm">Published 21 Dec 2023</p>
      <h1 class="text-xl font-extrabold mb-4
      sm:text-2xl cursor-pointer
      hover:text-Yellow">HTML & CSS foundations</h1>
      <p class="text-Gray-500 text-sm mb-6
      sm:text-base sm:mb-5">These languages are the backbone of every website, defining structure, content, and presentation.</p>
      
      <div class="flex items-center font-extrabold gap-3
      text-sm">
        <img 
        src="./assets/images/image-avatar.webp" 
        alt="Image Avatar Greg Hooper"
        class="w-8">      
        <p>Greg Hooper</p>
      </div>

    </div>
  </main>
  
</body>
</html>
